name: Package build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.py"
      - "requirements*.txt"
      - "VoiceTerm.spec"
      - "installer/**"
      - "scripts/build_*"
      - ".github/workflows/package-build.yml"
  push:
    branches:
      - feat/desktop-packaging
    paths:
      - "**.py"
      - "requirements*.txt"
      - "VoiceTerm.spec"
      - "installer/**"
      - "scripts/build_*"
      - ".github/workflows/package-build.yml"

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Linux system build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build application bundle
        run: python scripts/build_bundle.py

      - name: Upload application bundle
        uses: actions/upload-artifact@v7
        with:
          name: VoiceTerm-${{ runner.os }}-x64
          path: dist/VoiceTerm
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows installer
    needs: bundle
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download Windows bundle
        uses: actions/download-artifact@v8
        with:
          name: VoiceTerm-Windows-x64
          path: dist/VoiceTerm

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: powershell
        run: ./scripts/build_windows_installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: VoiceTerm-Windows-Setup-x64
          path: installer/output/*.exe
          if-no-files-found: error
          retention-days: 14
